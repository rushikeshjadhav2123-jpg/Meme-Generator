<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101226">
  <title>Meme Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>😂 Meme Generator</h1>
    <p>Create funny memes from your photos</p>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Choose a Template</h2>
      <div class="templates">
        <button class="template active" data-emoji="😂" data-bg="#5141a8"
          data-top="WHEN LIFE GIVES YOU BUGS" data-bottom="CALL IT A FEATURE">🐛 Bugs</button>
        <button class="template" data-emoji="😎" data-bg="#176b87"
          data-top="I HAVE NO IDEA" data-bottom="BUT I LOOK CONFIDENT">😎 Confidence</button>
        <button class="template" data-emoji="💻" data-bg="#713c8e"
          data-top="IT WORKED ON MY MACHINE" data-bottom="DEPLOY IT ANYWAY">💻 Developer</button>
        <button class="template" data-emoji="📚" data-bg="#9a5738"
          data-top="EXAM TOMORROW" data-bottom="START STUDYING AT 2 AM">📚 Student</button>
        <button class="template" data-emoji="🎉" data-bg="#b13f83"
          data-top="FRIDAY IS HERE" data-bottom="MONDAY IS LOADING">🎉 Weekend</button>
        <button class="template" data-emoji="✨" data-bg="#35466f"
          data-top="EXPECTATIONS" data-bottom="REALITY">✨ Classic</button>
      </div>
    </section>

    <section class="panel">
      <h2>Meme Preview <span class="live">LIVE</span></h2>
      <div class="canvas-wrap">
        <canvas id="memeCanvas" width="600" height="600"></canvas>
      </div>
      <p id="status" role="status" aria-live="polite">Ready to create your meme!</p>
      <div class="downloads">
        <button id="pngBtn" class="primary">⬇️ Download PNG</button>
        <button id="gifBtn">🎞️ Download GIF</button>
        <button id="videoBtn">🎬 Download Video</button>
      </div>
    </section>

    <section class="panel">
      <h2>Customize Meme</h2>

      <label for="imageInput">Upload Your Photo</label>
      <input type="file" id="imageInput" accept="image/*">

      <label for="topText">Top Caption</label>
      <input id="topText" type="text" maxlength="160"
        value="WHEN LIFE GIVES YOU BUGS">

      <label for="bottomText">Bottom Caption</label>
      <input id="bottomText" type="text" maxlength="160"
        value="CALL IT A FEATURE">

      <label for="fontSize">Text Size: <span id="sizeValue">38</span> px</label>
      <input id="fontSize" type="range" min="18" max="58" value="38">

      <label for="textColor">Text Color</label>
      <input id="textColor" type="color" value="#ffffff">

      <label for="outline">Text Outline</label>
      <input id="outline" type="checkbox" checked>

      <label for="uppercase">Uppercase Text</label>
      <input id="uppercase" type="checkbox" checked>

      <label for="animation">Animation</label>
      <select id="animation">
        <option value="none">None</option>
        <option value="bounce">Bounce</option>
        <option value="pulse">Pulse</option>
      </select>

      <label for="duration">GIF / Video Duration</label>
      <select id="duration">
        <option value="2">2 seconds</option>
        <option value="3" selected>3 seconds</option>
        <option value="4">4 seconds</option>
        <option value="5">5 seconds</option>
      </select>

      <div class="actions">
        <button id="resetBtn">🔄 Reset</button>
        <button id="clearPhotoBtn">🗑️ Remove Photo</button>
      </div>
    </section>
  </main>

  <footer>Made with ❤️ using HTML, CSS and JavaScript</footer>

  <!-- Load GIF library before script.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script src="script.js"></script>
</body>
</html>
