<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Meme Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="#">😂 Meme Generator</a>
  <span class="tag">Create • Customize • Download</span>
</header>
<main class="container">
  <section class="hero">
    <h1>Create Your Own <span>Memes</span></h1>
    <p>Choose a template or upload your own photo and make something funny.</p>
  </section>
  <section class="templates-section">
    <h2>Choose a Template</h2>
    <div class="templates" id="templates">
      <button class="template" data-emoji="😂" data-top="WHEN THE EXAM IS EASY" data-bottom="BUT YOU DIDN'T STUDY">😂<small>Exam Mood</small></button>
      <button class="template" data-emoji="😎" data-top="ME AFTER ONE TUTORIAL" data-bottom="I AM A PROFESSIONAL NOW">😎<small>Confidence</small></button>
      <button class="template" data-emoji="😭" data-top="SALARY DAY" data-bottom="BILLS THE NEXT DAY">😭<small>Reality</small></button>
      <button class="template" data-emoji="🤯" data-top="JUST ONE MORE EPISODE" data-bottom="IT'S 5 AM ALREADY">🤯<small>Late Night</small></button>
      <button class="template" data-emoji="🤣" data-top="FRIEND: I KNOW A SHORTCUT" data-bottom="US, LOST FOR 2 HOURS">🤣<small>Friends</small></button>
      <button class="template" data-emoji="😴" data-top="ME OPENING MY BOOK" data-bottom="MY BRAIN: GOOD NIGHT">😴<small>Study Time</small></button>
    </div>
  </section>
  <section class="editor-layout">
    <div class="preview-panel">
      <div class="panel-heading">
        <h2>Meme Preview</h2>
        <span class="live-badge">LIVE</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="memeCanvas" width="800" height="600"></canvas>
      </div>
      <p id="status" class="status" aria-live="polite">Choose a template or upload a photo.</p>
      <div class="download-buttons">
        <button id="pngBtn" class="btn primary">⬇ Download PNG</button>
        <button id="gifBtn" class="btn secondary">🎞 Download GIF</button>
        <button id="videoBtn" class="btn secondary">🎬 Download Video</button>
      </div>
    </div>
    <aside class="controls">
      <h2>Customize Meme</h2>
      <label class="upload-box" for="imageInput">
        <span>📷</span>
        <strong>Upload Your Photo</strong>
        <small>JPG, PNG or WebP</small>
      </label>
      <input id="imageInput" type="file" accept="image/*" hidden>
      <label for="topText">Top Caption</label>
      <textarea id="topText" rows="2" placeholder="Enter top text...">WHEN LIFE GIVES YOU BUGS</textarea>
      <label for="bottomText">Bottom Caption</label>
      <textarea id="bottomText" rows="2" placeholder="Enter bottom text...">CALL IT A FEATURE</textarea>
      <label for="fontSize">Text Size: <span id="sizeValue">38</span>px</label>
      <input id="fontSize" type="range" min="18" max="64" value="38">
      <label for="textColor">Text Color</label>
      <input id="textColor" type="color" value="#ffffff">
      <label for="animation">Text Animation</label>
      <select id="animation">
        <option value="none">No Animation</option>
        <option value="bounce">Bounce</option>
        <option value="pulse">Pulse</option>
      </select>
      <label for="duration">GIF / Video Duration</label>
      <select id="duration">
        <option value="2">2 seconds</option>
        <option value="3" selected>3 seconds</option>
        <option value="5">5 seconds</option>
      </select>
      <label class="check-row">
        <input id="outline" type="checkbox" checked>
        Black text outline
      </label>
      <label class="check-row">
        <input id="uppercase" type="checkbox" checked>
        Uppercase captions
      </label>
      <div class="control-buttons">
        <button id="resetBtn" class="btn secondary">Reset</button>
        <button id="clearPhotoBtn" class="btn secondary">Remove Photo</button>
      </div>
    </aside>
  </section>
  <footer>
    <p>😂 Meme Generator — Make your own memes and share the laughter!</p>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
