
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101226">
  <title>Meme Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>😂 Meme Generator</h1>
    <p>Create, customize and download your memes!</p>
  </header>

  <main class="app-container">
    <section class="panel">
      <h2>Choose a Template</h2>
      <div class="templates">
        <button type="button" class="template-btn" data-template="bugs">🐛 Bugs</button>
        <button type="button" class="template-btn" data-template="success">😎 Success</button>
        <button type="button" class="template-btn" data-template="work">💻 Work</button>
        <button type="button" class="template-btn" data-template="student">📚 Student</button>
        <button type="button" class="template-btn" data-template="weekend">🎉 Weekend</button>
        <button type="button" class="template-btn" data-template="custom">✨ Custom</button>
      </div>
    </section>

    <section class="panel">
      <h2>Meme Preview <span class="live-badge">LIVE</span></h2>
      <div class="canvas-wrap">
        <canvas id="c" width="600" height="600"></canvas>
      </div>
      <p id="statusText" role="status">Ready to create your meme!</p>

      <div class="download-buttons">
        <button type="button" id="downloadButton">⬇️ Download PNG</button>
        <button type="button" id="downloadGifButton">🎞️ Download GIF</button>
        <button type="button" id="downloadVideoButton">🎬 Download Video</button>
      </div>
    </section>

    <section class="panel">
      <h2>Customize Meme</h2>

      <label for="imageInput">Upload Your Photo</label>
      <input type="file" id="imageInput" accept="image/*">

      <label for="topText">Top Caption</label>
      <input id="topText" type="text" maxlength="120"
        placeholder="Enter top caption">

      <label for="bottomText">Bottom Caption</label>
      <input id="bottomText" type="text" maxlength="120"
        placeholder="Enter bottom caption">

      <label for="textSize">Text Size</label>
      <input id="textSize" type="range" min="20" max="64" value="36">
      <span id="sizeValue">36 px</span>

      <label for="textColor">Text Color</label>
      <input id="textColor" type="color" value="#ffffff">

      <label for="strokeColor">Outline Color</label>
      <input id="strokeColor" type="color" value="#000000">

      <label for="mood">Meme Mood</label>
      <select id="mood">
        <option value="funny">Funny</option>
        <option value="sarcastic">Sarcastic</option>
        <option value="relatable">Relatable</option>
        <option value="motivational">Motivational</option>
      </select>

      <div class="action-buttons">
        <button type="button" id="resetButton">🔄 Reset</button>
        <button type="button" id="removePhotoButton">🗑️ Remove Photo</button>
      </div>
    </section>
  </main>

  <!-- Load the GIF library BEFORE script.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
  <script src="script.js"></script>
</body>
</html>
